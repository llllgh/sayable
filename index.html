<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Locue</title>
<meta name="description" content="把听懂的英文表达，变成能说出口的个人表达库。" />
<meta name="theme-color" content="#F6F8F5" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor:; connect-src 'self' https: http: ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:;" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Locue" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header id="topbar">
    <a class="tb-title" href="#home" aria-label="Locue · 今天">
      <svg class="brand-mark" viewBox="92 124 328 294" aria-hidden="true">
        <defs><path id="locue-phrase" d="M47 0H81C111 0 128 17 128 47V101C128 143 105 174 70 194C61 199 53 189 59 181C72 163 79 145 80 128H47C17 128 0 111 0 81V47C0 17 17 0 47 0Z"/></defs>
        <use href="#locue-phrase" transform="translate(108 208)"/>
        <use href="#locue-phrase" transform="translate(276 138)"/>
      </svg>
      <strong>Locue</strong>
    </a>
    <button id="mode-chip" type="button" hidden aria-label="连接模型，打开设置">连接模型</button>
    <button class="tb-right" id="btn-settings" aria-label="设置">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6"/></svg>
    </button>
  </header>

  <main id="app" role="main"></main>

  <nav id="tabbar" aria-label="主要导航">
    <button data-route="home" class="tab tab-destination"><svg viewBox="0 0 24 24" class="ic"><path d="M4 11.5 12 4.5l8 7"/><path d="M6 10.6V20h12v-9.4"/></svg><em>今天</em></button>
    <button id="global-capture" class="tab tab-capture" type="button"><svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg><em>记一句</em><span class="capture-draft-dot" hidden aria-label="有未保存草稿"></span></button>
    <button data-route="library" class="tab tab-destination"><svg viewBox="0 0 24 24" class="ic"><path d="M5 5.5h6v13H5zM13 5.5h6v13h-6z"/></svg><em>表达库</em></button>
  </nav>

  <div id="sheet" class="sheet" aria-hidden="true" inert>
    <div class="sheet-scrim" data-close></div>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip" data-close></div>
      <div class="sheet-head"><h3 id="sheet-title"></h3><button class="x" data-close aria-label="关闭">✕</button></div>
      <div class="sheet-body" id="sheet-body"></div>
    </section>
  </div>

  <div id="toast" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
